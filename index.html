<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cup 2026 · Sweepstake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f6f9;
      --bg-elevated: #ffffff;
      --surface: #eef1f6;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --accent: #0d7a4e;
      --accent-light: #e8f7ef;
      --accent-glow: rgba(13, 122, 78, 0.25);
      --gold: #c9a227;
      --gold-light: #fdf6e3;
      --border: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.14);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 12px 40px rgba(15, 23, 42, 0.1);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 999px;
      --font-display: "Outfit", system-ui, sans-serif;
      --font-body: "DM Sans", system-ui, sans-serif;
      --hero-from: #0a3d2e;
      --hero-mid: #0f5c44;
      --hero-to: #1a7a5c;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f14;
        --bg-elevated: #141b24;
        --surface: #1a2330;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --text-faint: #64748b;
        --accent: #34d399;
        --accent-light: rgba(52, 211, 153, 0.12);
        --accent-glow: rgba(52, 211, 153, 0.2);
        --gold: #e8c547;
        --gold-light: rgba(232, 197, 71, 0.1);
        --border: rgba(255, 255, 255, 0.07);
        --border-strong: rgba(255, 255, 255, 0.12);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.25);
        --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.35);
        --hero-from: #061a14;
        --hero-mid: #0a2e22;
        --hero-to: #0f4535;
      }
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding-bottom: 4rem;
    }

    /* HERO */
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--hero-from) 0%, var(--hero-mid) 45%, var(--hero-to) 100%);
      color: #fff;
      padding: 3rem 1.5rem 2.5rem;
      text-align: center;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 120%, rgba(201, 162, 39, 0.15) 0%, transparent 60%),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 40px,
          rgba(255, 255, 255, 0.02) 40px,
          rgba(255, 255, 255, 0.02) 41px
        );
      pointer-events: none;
    }
    .hero-inner { position: relative; z-index: 1; }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(201, 162, 39, 0.15);
      border: 1px solid rgba(201, 162, 39, 0.3);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      margin-bottom: 1rem;
    }
    .hero-trophy {
      font-size: 52px;
      line-height: 1;
      margin-bottom: 0.75rem;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .hero h1 span { color: var(--gold); }
    .hero-sub {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 0.5rem;
    }
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 520px;
      margin: 1.75rem auto 0;
    }
    .stat {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 12px 8px;
    }
    .stat-value {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* NAV */
    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.75rem 1.5rem;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      max-width: 560px;
      margin: 0 auto;
    }
    .tab {
      flex: 1;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab:hover { color: var(--text); }
    .tab:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .tab.active {
      background: var(--bg-elevated);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    /* SECTIONS */
    .section {
      display: none;
      padding: 1.75rem 1.5rem;
      animation: fadeUp 0.35s ease;
    }
    .section.active { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .section-title {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    /* DRAW GRID */
    .draw-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .player-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      animation: cardIn 0.4s ease backwards;
    }
    .player-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .player-accent {
      height: 4px;
      width: 100%;
    }
    .player-body { padding: 1rem 1rem 0.875rem; }
    .player-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.06);
    }
    .player-info { min-width: 0; }
    .player-name {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .player-count {
      font-size: 11px;
      color: var(--text-faint);
      font-weight: 500;
    }
    .teams-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .team-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .player-card:hover .team-row { background: color-mix(in srgb, var(--surface) 70%, var(--accent-light)); }
    .team-flag {
      font-size: 20px;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
      line-height: 1;
    }
    .team-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .grp-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border);
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }

    /* FIXTURES */
    .fixtures-layout { display: flex; flex-direction: column; gap: 1.25rem; }
    .person-tabs-wrap {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .person-tabs-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      margin-bottom: 0.75rem;
    }
    .person-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .ptab {
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ptab:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }
    .ptab:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .ptab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .fixture-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .fix-header {
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, var(--surface) 0%, var(--bg-elevated) 100%);
    }
    .fix-my-teams {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .team-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      background: var(--bg-elevated);
      box-shadow: var(--shadow-sm);
    }
    .team-chip .grp-badge {
      background: var(--surface);
    }
    .fix-body { padding: 0.5rem 1.25rem 1.25rem; }
    .date-head {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 0 10px;
    }
    .date-head::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .date-head:first-of-type { padding-top: 8px; }
    .fixture-row {
      display: grid;
      grid-template-columns: 56px 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin-bottom: 6px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      font-size: 13px;
      transition: background 0.15s;
    }
    .fixture-row:hover { background: color-mix(in srgb, var(--surface) 80%, var(--accent-light)); }
    .fixture-row.has-yours {
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      background: var(--accent-light);
    }
    .fix-time {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .fix-time small {
      display: block;
      font-size: 10px;
      font-weight: 500;
      color: var(--text-faint);
    }
    .fix-team {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-weight: 500;
    }
    .fix-team.right {
      justify-content: flex-end;
      text-align: right;
      flex-direction: row-reverse;
    }
    .fix-team .flag { font-size: 20px; line-height: 1; flex-shrink: 0; }
    .fix-team .name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fix-vs {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 8px;
      background: var(--bg-elevated);
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
    }
    .yours-badge {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 7px;
      border-radius: var(--radius-pill);
      flex-shrink: 0;
    }

    /* GROUPS */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .group-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .group-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 80%, #000) 100%);
      color: #fff;
    }
    .group-letter {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }
    .group-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
    }
    .group-sub {
      font-size: 11px;
      opacity: 0.75;
      font-weight: 500;
    }
    .group-body { padding: 12px 16px 16px; }
    .group-team {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
    }
    .group-team:last-of-type { border-bottom: none; }
    .group-team .flag { font-size: 18px; width: 26px; text-align: center; }
    .group-fixtures-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-faint);
      margin: 14px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .group-fix {
      font-size: 11px;
      color: var(--text-muted);
      padding: 6px 8px;
      margin-bottom: 4px;
      background: var(--surface);
      border-radius: 6px;
      display: flex;
      gap: 8px;
      align-items: center;
      line-height: 1.35;
    }
    .group-fix .date {
      font-weight: 700;
      color: var(--text-faint);
      min-width: 38px;
      font-size: 10px;
    }

    /* SHARE BAR */
    .share-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      padding: 12px 14px;
      background: var(--gold-light);
      border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
      border-radius: var(--radius-md);
    }
    .share-bar-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      min-width: 0;
    }
    .share-bar-text strong { font-weight: 700; }
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .share-btn:hover { transform: translateY(-1px); }
    .share-btn.secondary {
      background: var(--bg-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .share-btn.copied { background: var(--gold); color: #1a1a1a; }

    .personal-banner {
      margin: 0 1.5rem;
      margin-top: -0.5rem;
      margin-bottom: 0;
      padding: 12px 16px;
      background: var(--accent-light);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      animation: fadeUp 0.35s ease;
    }
    .personal-banner strong { color: var(--accent); font-weight: 700; }

    /* LEADERBOARD */
    .lb-rules {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .lb-rules h3 {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .lb-rules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }
    .lb-rule {
      font-size: 12px;
      color: var(--text-muted);
      padding: 8px 10px;
      background: var(--surface);
      border-radius: var(--radius-sm);
    }
    .lb-rule strong {
      display: block;
      font-size: 18px;
      font-family: var(--font-display);
      color: var(--accent);
      font-weight: 800;
      line-height: 1.2;
    }

    .lb-podium {
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      gap: 10px;
      align-items: end;
      margin-bottom: 1.25rem;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }
    .podium-slot {
      text-align: center;
      padding: 14px 10px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      box-shadow: var(--shadow-sm);
    }
    .podium-slot.first {
      padding-top: 20px;
      border-color: color-mix(in srgb, var(--gold) 50%, transparent);
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--bg-elevated) 100%);
    }
    .podium-slot.second { margin-bottom: 12px; }
    .podium-slot.third { margin-bottom: 24px; }
    .podium-medal { font-size: 28px; line-height: 1; margin-bottom: 6px; }
    .podium-name {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
    }
    .podium-pts {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1.2;
    }
    .podium-pts span { font-size: 11px; font-weight: 600; color: var(--text-faint); }

    .lb-list { display: flex; flex-direction: column; gap: 8px; }
    .lb-row {
      display: grid;
      grid-template-columns: 36px 42px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s;
    }
    .lb-row:hover { border-color: var(--border-strong); }
    .lb-row.top-1 { border-color: color-mix(in srgb, var(--gold) 40%, transparent); }
    .lb-rank {

  const a = [...arr]; let s = seed;

function mapApiTeam(name) {
  if (API_TEAM_TO_OURS[name]) return API_TEAM_TO_OURS[name];
  if (allTeams.some(t => t.n === name)) return name;
  return null;
}

function parseKoRound(round) {
  if (!round || /group/i.test(round)) return null;
  const r = round.trim();
  if (/round of 32/i.test(r)) return 'r32';
  if (/round of 16|8th finals/i.test(r)) return 'r16';
  if (/quarter/i.test(r)) return 'qf';
  if (/semi/i.test(r)) return 'sf';
  if (/^final$/i.test(r)) return 'final';
  return null;
}

function deriveKnockout(apiFixtures) {
  const rank = { r32: 0, r16: 1, qf: 2, sf: 3, final: 4, winner: 5 };
  const progress = {};
  apiFixtures.forEach(f => {
    const rk = parseKoRound(f.round);
    if (!rk || f.status !== 'FT') return;
    const home = mapApiTeam(f.home);
    const away = mapApiTeam(f.away);
    [[home, f.homeWinner], [away, f.awayWinner]].forEach(([team, won]) => {
      if (!team) return;
      const reached = rk === 'final' && won ? 'winner' : rk;
      if (!progress[team] || rank[reached] > rank[progress[team]]) progress[team] = reached;
    });
  });
  return progress;
}

function applyApiScores(data) {
  Object.keys(matchResults).forEach(k => delete matchResults[k]);
  Object.keys(teamKnockout).forEach(k => delete teamKnockout[k]);
  if (!data?.fixtures?.length) return 0;

  const indexMap = {};
  fixtures.forEach((f, i) => { indexMap[`${f.h}|${f.a}`] = i; });

  let matched = 0;
  data.fixtures.forEach(af => {
    if (af.status !== 'FT' || af.h == null || af.a == null) return;
    const home = mapApiTeam(af.home);
    const away = mapApiTeam(af.away);
    if (!home || !away) return;
    const idx = indexMap[`${home}|${away}`];
    if (idx != null) {
      matchResults[idx] = { h: af.h, a: af.a };
      matched++;
    }
  });

  Object.assign(teamKnockout, deriveKnockout(data.fixtures));
  return matched;
}

  if (!el || !text) return;

  el.classList.remove('live', 'warn');
  if (scoresMeta.loading) {
    text.textContent = 'Loading live scores…';
    return;
  }
  if (scoresMeta.error && scoresMeta.count === 0) {
    el.classList.add('warn');
    text.textContent = `Scores unavailable: ${scoresMeta.error}`;
    return;
  }
  const when = scoresMeta.updatedAt
    ? new Date(scoresMeta.updatedAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
    : '';
  const n = scoresMeta.count;
  const live = scoresMeta.live || 0;
  el.classList.add('live');
  text.textContent = n > 0
    ? `Live scores · ${n} results synced${live ? ` · ${live} live now` : ''} · Updated ${when}`
    : live > 0
      ? `${live} match(es) live now · Updated ${when}`
      : `Live scores connected · Waiting for results · ${when}`;
}

    scoresMeta.updatedAt = data.updatedAt;
    scoresMeta.error = data.error;
    scoresMeta.live = (data.fixtures || []).filter(f => f.status === 'LIVE').length;
    scoresMeta.count = applyApiScores(data);
  } catch (e) {
    scoresMeta.error = e.message;
    scoresMeta.count = 0;
  }
  scoresMeta.loading = false;
  updateScoresStatus();
  if (document.getElementById('sec-leaderboard').classList.contains('active')) buildLeaderboardSection();
  if (document.querySelector('#fixture-view')) showPersonFixtures(activePlayer || people[0]);
}

function getMatchPoints(team, f, result) {
  if (!result || result.h == null || result.a == null) return null;
  const isHome = f.h === team, isAway = f.a === team;
  if (!isHome && !isAway) return 0;
  if (result.h === result.a) return SCORING.draw;
  if ((isHome && result.h > result.a) || (isAway && result.a > result.h)) return SCORING.win;
  return 0;
}

function getKnockoutPoints(team) {
  const round = teamKnockout[team];
  if (!round) return 0;
  let pts = 0;
  const end = round === 'winner' ? 'final' : round;
  for (const r of KNOCKOUT_ORDER) {
    pts += SCORING.knockout[r];
    if (r === end) break;
  }
  if (round === 'winner') pts += SCORING.worldCupWinner;
  return pts;
}

function getTeamMatchResult(team, f, result) {
  if (!result || result.h == null || result.a == null) return null;
  const isHome = f.h === team, isAway = f.a === team;
  if (!isHome && !isAway) return null;
  if (result.h === result.a) return 'draw';
  if ((isHome && result.h > result.a) || (isAway && result.a > result.h)) return 'win';
  return 'loss';
}

function calcPlayerScore(person) {
  const teams = draw[person];
  let group = 0, knockout = 0, wins = 0, draws = 0, losses = 0;
  fixtures.forEach((f, i) => {
    const result = matchResults[i];
    if (!result) return;
    teams.forEach(t => {
      const p = getMatchPoints(t, f, result);
      const r = getTeamMatchResult(t, f, result);
      if (r === 'win') wins++;
      else if (r === 'draw') draws++;
      else if (r === 'loss') losses++;
      group += p || 0;
    });
  });
  teams.forEach(t => { knockout += getKnockoutPoints(t); });
  return { group, knockout, total: group + knockout, wins, draws, losses, teams };
}

function getLeaderboard() {
  return people
    .map(p => ({ person: p, ...calcPlayerScore(p), idx: people.indexOf(p) }))
    .sort((a, b) => b.total - a.total || b.group - a.group || a.person.localeCompare(b.person));
}

/* ── URL & SHARING ── */
let activePlayer = null;

function findPerson(name) {
  if (!name) return null;
  const decoded = decodeURIComponent(name);
  return people.find(p => p.toLowerCase() === decoded.toLowerCase()) || null;
}

function playerShareUrl(person) {
  const url = new URL(location.href);
  url.searchParams.set('player', person);
  url.searchParams.set('tab', 'fixtures');
  return url.toString();
}

async function copyShareLink(person, btn) {
  const url = playerShareUrl(person);
  try {
    await navigator.clipboard.writeText(url);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
  }
}

function updateUrl(tab, player) {
  const url = new URL(location.href);
  if (tab && tab !== 'draw') url.searchParams.set('tab', tab);
  else url.searchParams.delete('tab');
  if (player && tab === 'fixtures') url.searchParams.set('player', player);
  else url.searchParams.delete('player');
  history.replaceState(null, '', url);
}

function showSection(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tabs .tab').forEach(t => {
    t.classList.remove('active');
    t.setAttribute('aria-selected', 'false');
  });
  document.getElementById('sec-' + id).classList.add('active');
  const tabBtn = btn || document.querySelector(`.tab[data-tab="${id}"]`);
  if (tabBtn) {
    tabBtn.classList.add('active');
    tabBtn.setAttribute('aria-selected', 'true');
  }
  if (id === 'leaderboard') buildLeaderboardSection();
  if (id === 'fixtures') {
    if (!document.querySelector('.ptab')) buildFixturesSection();
    else if (activePlayer) showPersonFixtures(activePlayer);
  }
  if (id === 'groups' && !document.querySelector('.group-card')) buildGroupsSection();
  updateUrl(id, activePlayer);
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => showSection(btn.dataset.tab, btn));
});

/* BUILD DRAW */
const drawSec = document.getElementById('sec-draw');
const drawGrid = document.createElement('div');
drawGrid.className = 'draw-grid';
people.forEach((person, i) => {
  const teams = draw[person].map(n => getTeam(n));
  const ac = avatarPalette[i];
  const card = document.createElement('div');
  card.className = 'player-card';
  card.style.animationDelay = `${i * 0.03}s`;
  card.innerHTML =
    `<div class="player-accent" style="background:${ac.c}"></div>
    <div class="player-body">
      <div class="player-header">
        <div class="avatar" style="background:${ac.bg};color:${ac.c}">${initials(person)}</div>
        <div class="player-info">
          <div class="player-name">${person}</div>
          <div class="player-count">3 teams</div>
        </div>
      </div>
      <div class="teams-list">` +
    teams.map(t =>
      `<div class="team-row">
        <span class="team-flag">${t.f}</span>
        <span class="team-name">${t.n}</span>
        <span class="grp-badge">${t.g}</span>
      </div>`
    ).join('') +
    `<div class="player-card-actions">
      <button class="card-link-btn" onclick="activePlayer='${person}'; showSection('fixtures', document.querySelector('[data-tab=fixtures]'))">View fixtures</button>
      <button class="card-link-btn" onclick="copyShareLink('${person}', this)">Copy link</button>
    </div></div></div>`;
  drawGrid.appendChild(card);
});
drawSec.appendChild(drawGrid);

/* BUILD LEADERBOARD */
function buildLeaderboardSection() {
  const sec = document.getElementById('sec-leaderboard');
  const board = getLeaderboard();
  const hasResults = scoresMeta.count > 0 || Object.keys(teamKnockout).length > 0;
  const leader = board[0];

  let html = `<div class="section-title">Standings</div>
    <div class="lb-rules">
      <h3>Scoring rules</h3>
      <div class="lb-rules-grid">
        <div class="lb-rule"><strong>${SCORING.win}</strong>pts per win</div>
        <div class="lb-rule"><strong>${SCORING.draw}</strong>pt per draw</div>
        <div class="lb-rule"><strong>+${SCORING.knockout.r32}</strong>per KO round</div>
        <div class="lb-rule"><strong>+${SCORING.worldCupWinner}</strong>World Cup winner</div>
      </div>
    </div>`;

  if (hasResults && board.length >= 3) {
    const medals = ['🥇', '🥈', '🥉'];
    const slots = ['second', 'first', 'third'];
    const order = [1, 0, 2];
    html += `<div class="lb-podium">`;
    order.forEach((ri, i) => {
      const e = board[ri];
      if (!e) return;
      html += `<div class="podium-slot ${slots[i]}">
        <div class="podium-medal">${medals[i]}</div>
        <div class="podium-name">${e.person}</div>
        <div class="podium-pts">${e.total}<span> pts</span></div>
      </div>`;
    });
    html += `</div>`;
  } else if (!hasResults) {
    html += `<div class="lb-empty">
      <strong>Tournament hasn't started yet</strong><br>
      Everyone is tied on 0 pts — check back once matches kick off!
    </div>`;
  }

  html += `<div class="lb-list">`;
  board.forEach((e, rank) => {
    const ac = avatarPalette[e.idx];
    const topClass = rank < 3 ? ` top-${rank + 1}` : '';
    const teamStr = e.teams.map(n => getTeam(n).f).join(' ');
    html += `<div class="lb-row${topClass}" style="cursor:pointer" onclick="activePlayer='${e.person}'; showSection('fixtures', document.querySelector('[data-tab=fixtures]'))" title="View ${e.person}'s fixtures">
      <div class="lb-rank">${rank + 1}</div>
      <div class="avatar" style="background:${ac.bg};color:${ac.c};width:36px;height:36px;font-size:11px;border-radius:10px">${initials(e.person)}</div>
      <div class="lb-info">
        <div class="lb-name">${e.person}</div>
        <div class="lb-teams">${teamStr} ${hasResults ? `· ${e.wins}W ${e.draws}D` : ''}</div>
      </div>
      <div class="lb-score-col">
        <div class="lb-total">${e.total}</div>
        <div class="lb-breakdown">${e.group} grp · ${e.knockout} ko</div>
      </div>
    </div>`;
  });
  html += `</div>`;

  if (hasResults && leader) {
    html += `<div class="share-bar" style="margin-top:1.25rem">
      <span class="share-bar-text"><strong>${leader.person}</strong> leads with ${leader.total} pts</span>
    </div>`;
  }

  sec.innerHTML = html;
}

/* BUILD FIXTURES */
function buildFixturesSection() {
  const sec = document.getElementById('sec-fixtures');
  sec.innerHTML = '<div class="section-title">Your matches</div>';
  const layout = document.createElement('div');
  layout.className = 'fixtures-layout';

  const ptabsWrap = document.createElement('div');
  ptabsWrap.className = 'person-tabs-wrap';
  ptabsWrap.innerHTML = '<div class="person-tabs-label">Select player</div>';
  const ptabsDiv = document.createElement('div');
  ptabsDiv.className = 'person-tabs';
  people.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'ptab';
    btn.textContent = p;
    btn.onclick = () => showPersonFixtures(p);
    ptabsDiv.appendChild(btn);
  });
  ptabsWrap.appendChild(ptabsDiv);
  layout.appendChild(ptabsWrap);

  const panel = document.createElement('div');
  panel.className = 'fixture-panel';
  panel.id = 'fixture-view';
  layout.appendChild(panel);
  sec.appendChild(layout);
  showPersonFixtures(activePlayer || people[0]);
}

function showPersonFixtures(person) {
  activePlayer = person;
  document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
  const btn = document.querySelector(`.ptab:nth-child(${people.indexOf(person)+1})`);
  if (btn) btn.classList.add('active');
  const myNames = draw[person];
  const myTeams = myNames.map(n => getTeam(n));
  const myFix = fixtures.map((f, i) => ({ ...f, idx: i })).filter(f => myNames.includes(f.h) || myNames.includes(f.a));
  const ac = avatarPalette[people.indexOf(person)];
  const score = calcPlayerScore(person);

  let html = `<div class="fix-header">
    <div class="share-bar">
      <span class="share-bar-text">Share <strong>${person}'s</strong> page · ${score.total} pts</span>
      <button class="share-btn" id="share-btn-main" onclick="copyShareLink('${person}', this)">Copy personal link</button>
    </div>
    <div class="fix-my-teams">` +
    myTeams.map(t => {
      const ko = teamKnockout[t.n];
      const koLabel = ko ? ` · ${ko === 'winner' ? '🏆 Winner' : ko.toUpperCase()}` : '';
      return `<div class="team-chip"><span class="flag" style="font-size:20px">${t.f}</span><span>${t.n}</span><span class="grp-badge">Grp ${t.g}${koLabel}</span></div>`;
    }).join('') + `</div></div><div class="fix-body">`;

  let lastDate = '';
  myFix.forEach(f => {
    function teamBadge(team, owned, result) {
      if (!owned) return '';
      if (result && result.h != null) {
        const r = getTeamMatchResult(team, f, result);
        if (r) return `<span class="result-badge ${r}">${r === 'win' ? 'W' : r === 'draw' ? 'D' : 'L'}</span>`;
      }
      return `<span class="yours-badge" style="background:${ac.c};color:#fff">Yours</span>`;
    }
    if (f.d !== lastDate) {
      html += `<div class="date-head">${f.d}</div>`;
      lastDate = f.d;
    }
    const hOwned = myNames.includes(f.h);
    const aOwned = myNames.includes(f.a);
    const hTeam = getTeam(f.h);
    const aTeam = getTeam(f.a);
    const result = matchResults[f.idx];
    const highlight = hOwned || aOwned ? ' has-yours' : '';

    const mid = result && result.h != null
      ? `<div style="display:flex;flex-direction:column;align-items:center;gap:2px">
          <span class="fix-score">${result.h}–${result.a}</span>
          ${(hOwned || aOwned) ? `<span class="pts-earned">+${getMatchPoints(hOwned ? f.h : f.a, f, result) || 0}</span>` : ''}
        </div>`
      : '<span class="fix-vs">vs</span>';

    html += `<div class="fixture-row${highlight}">
      <div class="fix-time">${f.t}<small>GST</small></div>
      <div class="fix-team">
        <span class="flag">${hTeam.f}</span>
        <span class="name">${f.h}</span>
        ${teamBadge(f.h, hOwned, result)}
      </div>
      ${mid}
      <div class="fix-team right">
        <span class="flag">${aTeam.f}</span>
        <span class="name">${f.a}</span>
        ${teamBadge(f.a, aOwned, result)}
      </div>
    </div>`;
  });
  html += '</div>';
  const view = document.getElementById('fixture-view');
  if (view) view.innerHTML = html;
  document.title = `${person}'s Teams · World Cup 2026 Sweepstake`;
  updateUrl('fixtures', person);
}

/* BUILD GROUPS */
function buildGroupsSection() {
  const sec = document.getElementById('sec-groups');
  sec.innerHTML = '<div class="section-title">Group stage</div>';
  const grid = document.createElement('div');
  grid.className = 'groups-grid';
  const groupKeys = ['A','B','C','D','E','F','G','H','I','J','K','L'];
  const groupTeams = {};
  allTeams.forEach(t => {
    if (!groupTeams[t.g]) groupTeams[t.g] = [];
    groupTeams[t.g].push(t);
  });
  groupKeys.forEach(letter => {
    const teams = groupTeams[letter] || [];
    const gFix = fixtures.filter(f => f.g === letter);
    const card = document.createElement('div');
    card.className = 'group-card';
    card.innerHTML =
      `<div class="group-header">
        <div class="group-letter">${letter}</div>
        <div>
          <div class="group-title">Group ${letter}</div>
          <div class="group-sub">${teams.length} teams · ${gFix.length} matches</div>
        </div>
      </div>
      <div class="group-body">` +
      teams.map(t =>
        `<div class="group-team"><span class="flag">${t.f}</span><span>${t.n}</span></div>`
      ).join('') +
      `<div class="group-fixtures-title">Fixtures</div>` +
      gFix.map(f =>
        `<div class="group-fix">
          <span class="date">${f.d}</span>
          <span>${getTeam(f.h).f} ${f.h} <strong style="color:var(--text-faint);font-weight:600">vs</strong> ${f.a} ${getTeam(f.a).f}</span>
        </div>`
      ).join('') +
      `</div>`;
    grid.appendChild(card);
  });
  sec.appendChild(grid);
}

/* ── INIT FROM URL ── */
(function initFromUrl() {
  const params = new URLSearchParams(location.search);
  const urlPlayer = findPerson(params.get('player'));
  const urlTab = params.get('tab');

  if (urlPlayer) {
    activePlayer = urlPlayer;
    const banner = document.getElementById('personal-banner');
    banner.style.display = 'block';
    banner.innerHTML = `Welcome <strong>${urlPlayer}</strong> — here are your teams & fixtures`;
  }

  const tabMap = { draw: 'draw', leaderboard: 'leaderboard', fixtures: 'fixtures', groups: 'groups' };
  let startTab = 'draw';
  if (urlTab && tabMap[urlTab]) startTab = urlTab;
  else if (urlPlayer) startTab = 'fixtures';

  if (startTab === 'leaderboard') document.title = 'Leaderboard · World Cup 2026 Sweepstake';
  if (startTab !== 'draw') showSection(startTab);
  loadScores();
  setInterval(loadScores, 3 * 60 * 1000);
})();
</script>
